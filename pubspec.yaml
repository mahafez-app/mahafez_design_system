name: mahafez_design_system
description: Layer 1 Design System & UI Primitives for Mahafez Platform (Cairo typography, AppColors, AppSpacing, AppResponsive, UI primitives).
version: 1.0.2
repository: https://github.com/mahafez-app/mahafez_design_system
publish_to: 'none'

environment:
  sdk: ^3.13.3
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Cairo
      fonts:
        - asset: lib/fonts/Cairo/Cairo-Regular.ttf
          weight: 400
        - asset: lib/fonts/Cairo/Cairo-Medium.ttf
          weight: 500
        - asset: lib/fonts/Cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: lib/fonts/Cairo/Cairo-Bold.ttf
          weight: 700
        - asset: lib/fonts/Cairo/Cairo-ExtraBold.ttf
          weight: 800
