name: mahafez_design_system_example
description: Demonstrates how to use the mahafez_design_system package.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.3
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  mahafez_design_system:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: packages/mahafez_design_system/fonts/Cairo/Cairo-Regular.ttf
          weight: 400
        - asset: packages/mahafez_design_system/fonts/Cairo/Cairo-Medium.ttf
          weight: 500
        - asset: packages/mahafez_design_system/fonts/Cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: packages/mahafez_design_system/fonts/Cairo/Cairo-Bold.ttf
          weight: 700
        - asset: packages/mahafez_design_system/fonts/Cairo/Cairo-ExtraBold.ttf
          weight: 800
